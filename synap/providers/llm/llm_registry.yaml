# LLM Registry Configuration
# Defines available providers, models, and their characteristics

# The last-resort default: what the selector hands back when nothing else
# scores. It must be a provider every deployment actually carries a key for.
# Gemini is NEVER the default. No environment has a Google key, and while this
# said gemini every fallback landed on a provider that did not exist
# ("Provider gemini not available").
defaults:
  provider: "openai"
  model: "gpt-4o"

providers:
  # Disabled on purpose. No deployment sets GOOGLE_API_KEY / GEMINI_API_KEY,
  # and a provider that is enabled here but has no key is offered by the
  # selector and then fails at call time. Enable only together with a key,
  # and never as the default.
  gemini:
    enabled: false
    rate_limits:
      rpm: 2000
      tpm: 4000000
    models:
      gemini-2.5-flash:
        type: "flagship"
        max_tokens: 8192
        context_window: 1000000
        scores:
          speed: 10
          accuracy: 9
          reasoning: 9
          tool_usage: 9
        rate_limits:
          rpm: 2000
          tpm: 4000000
      gemini-2.5-flash-lite:
        type: "economy"
        max_tokens: 8192
        context_window: 1000000
        scores:
          speed: 10
          accuracy: 8
          reasoning: 7
          tool_usage: 8
        rate_limits:
          rpm: 4000
          tpm: 8000000

  openai:
    enabled: true
    rate_limits:
      rpm: 10000
      tpm: 2000000
    models:
      gpt-4o:
        type: "flagship"
        max_tokens: 4096
        context_window: 128000
        scores:
          speed: 8
          accuracy: 9
          reasoning: 9
          tool_usage: 10
        rate_limits:
          rpm: 5000
          tpm: 800000
      gpt-6-luna:
        # Named on purpose, never chosen by the selector (SYNAP_ER_MODEL sends the graph and
        # entity-resolution calls here). A model missing from this file makes the manager
        # raise "Model ... not found", which stores an empty graph.
        # Reasoning model: the provider sends max_completion_tokens and no temperature.
        # The numbers below are unverified placeholders; the selector never reads them.
        type: "flagship"
        selectable: false
        max_tokens: 32768
        context_window: 128000
        scores:
          speed: 5
          accuracy: 9
          reasoning: 10
          tool_usage: 9
        rate_limits:
          rpm: 1000
          tpm: 500000
      gpt-6.1-sol:
        # Named on purpose, never chosen by the selector: SYNAP_KU_CLASSIFY_MODEL
        # sends the knowledge-update pair classifier here. A model missing from
        # this file makes the manager raise "Model ... not found", which
        # makes every KU classification fail and the step a no-op.
        # Same trap as gpt-6-luna above, same fix.
        # Reasoning model: the provider sends max_completion_tokens and no
        # temperature, and floors the budget at SYNAP_OPENAI_MIN_COMPLETION_TOKENS.
        # $2.00 / $10.00 per 1M. The selector never reads the scores below.
        type: "flagship"
        selectable: false
        max_tokens: 32768
        context_window: 128000
        scores:
          speed: 5
          accuracy: 9
          reasoning: 10
          tool_usage: 9
        rate_limits:
          rpm: 1000
          tpm: 500000
      gpt-4o-mini:
        # Cheap + fast — used by the persistent AnticipationAgent
        # streaming loop where token throughput dominates cost.
        # Roughly $0.15 / $0.60 per 1M tokens vs. $5 / $15 for gpt-4o.
        type: "economy"
        max_tokens: 4096
        context_window: 128000
        scores:
          speed: 10
          accuracy: 8
          reasoning: 7
          tool_usage: 9
        rate_limits:
          rpm: 5000
          tpm: 800000

  anthropic:
    enabled: false
    rate_limits:
      rpm: 5000
      tpm: 1000000
    models:
      claude-3-5-sonnet-20241022:
        type: "flagship"
        max_tokens: 8192
        context_window: 200000
        scores:
          speed: 7
          accuracy: 10
          reasoning: 10
          tool_usage: 9
        rate_limits:
          rpm: 4000
          tpm: 400000

      claude-3-haiku-20240307:
        type: "economy"
        max_tokens: 4096
        context_window: 200000
        scores:
          speed: 9
          accuracy: 7
          reasoning: 6
          tool_usage: 8
        rate_limits:
          rpm: 4000
          tpm: 400000

  groq:
    enabled: true
    rate_limits:
      rpm: 2000
      tpm: 500000
    models:
      openai/gpt-oss-20b:
        type: "economy"
        max_tokens: 4096
        context_window: 131072
        scores:
          speed: 10
          accuracy: 7
          reasoning: 6
          tool_usage: 7
        rate_limits:
          rpm: 1000
          tpm: 1000000

      openai/gpt-oss-120b:
        type: "flagship"
        max_tokens: 8192
        context_window: 131072
        scores:
          speed: 9
          accuracy: 9
          reasoning: 9
          tool_usage: 8
        rate_limits:
          rpm: 1000
          tpm: 1000000
