# Weekly update pull requests. A maintainer reviews each one like any other pull request (CONTRIBUTING.md).
#
# - github-actions: the workflows pin each third-party action by commit SHA; Dependabot moves the SHA and the version comment.
# - docker: the base image in the Dockerfile.
# - docker-compose: the store images in deploy/docker-compose.yml, each pinned by version and digest.
# - pip: requirements.txt and e2e/requirements.txt. Major versions are ignored on purpose: a new major version of an engine
#   dependency (SQLAlchemy 2.1 once crashed the server on import) is a decision for a maintainer, not an automatic pull request.
#   torch is installed in the Dockerfile with its own pin and is moved by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5
    groups:
      actions: {patterns: ["*"]}

  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 3

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /e2e
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      e2e-minor-and-patch:
        update-types: ["minor", "patch"]
