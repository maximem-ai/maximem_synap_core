name: Publish the server image

# Manual only: run it from the Actions tab with a version, for example 0.1.0.
#
# Publishes one multi-architecture image (amd64 and arm64) to the GitHub container registry, so
# `docker compose up` works without a local build. Building from the Dockerfile stays possible.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag, for example 0.1.0"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ inputs.version }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Synap Core: open-source, self-hosted memory for AI agents
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
